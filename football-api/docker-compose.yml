services:
  mysql_db:
    image: mysql:8.0
    container_name: santex_academy_football_api_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306" # Make sure it is the same port as DB_PORT in your .env file'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent --skip-column-names -e 'SELECT COUNT(*) FROM football_db.players' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: santex_academy_backend
    depends_on:
      mysql_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      MALE_PLAYERS_CSV: /data/male_players.csv
      FEMALE_PLAYERS_CSV: /data/female_players.csv
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ../male_players-1.csv:/data/male_players.csv:ro
      - ../female_players-1.csv:/data/female_players.csv:ro
    ports:
      - "3000:3000"
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: santex_academy_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: npm run start -- --host 0.0.0.0


volumes:
  db_data:
